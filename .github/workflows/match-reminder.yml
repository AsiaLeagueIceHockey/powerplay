name: Match D-1 Reminder

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 20:00 KST
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: read

jobs:
  send-reminder:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Call match reminder endpoint
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          : "${APP_URL:?NEXT_PUBLIC_APP_URL is required}"
          : "${CRON_SECRET:?CRON_SECRET is required}"
          # 재시도는 중복 발송 위험이 있어 사용하지 않는다.
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 180 -X GET \
            "${APP_URL%/}/api/cron/match-reminder" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json"

      - name: Ping Better Stack heartbeat
        if: ${{ success() }}
        env:
          BETTER_STACK_HEARTBEAT_URL: ${{ secrets.BETTER_STACK_HEARTBEAT_MATCH_REMINDER_URL }}
        run: |
          if [ -n "$BETTER_STACK_HEARTBEAT_URL" ]; then
            curl --fail --silent --show-error --max-time 10 --retry 2 "$BETTER_STACK_HEARTBEAT_URL"
          fi
