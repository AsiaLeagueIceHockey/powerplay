name: Monthly Club Ranking Instagram Story

on:
  schedule:
    # 매월 1일 09:17 KST (00:17 UTC): 전월 투표가 모두 끝난 뒤 캡처.
    # UTC/KST 자정과 혼잡한 정각을 피하고 지연 실행에도 전월을 사용.
    - cron: "17 0 1 * *"
  workflow_dispatch:
    inputs:
      target_month:
        description: "캡처할 월 (YYYY-MM, 예: 2026-04). 비워두면 KST 기준 전월 (마감된 월)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Club Ranking Capture Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://powerplay.kr' }}
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/capture-club-ranking.ts

      - name: Preserve generated stories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-stories-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/instagram/
          if-no-files-found: ignore
          retention-days: 30

      - name: Ping Better Stack heartbeat
        if: ${{ success() }}
        env:
          BETTER_STACK_HEARTBEAT_URL: ${{ secrets.BETTER_STACK_HEARTBEAT_CLUB_RANKING_URL }}
        run: |
          if [ -n "$BETTER_STACK_HEARTBEAT_URL" ]; then
            curl --fail --silent --show-error --max-time 10 --retry 2 "$BETTER_STACK_HEARTBEAT_URL"
          fi
