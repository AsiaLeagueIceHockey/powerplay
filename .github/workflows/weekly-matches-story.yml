name: Weekly Matches Instagram Story Capture

on:
  schedule:
    # 일요일 21:00 KST (UTC 12:00) — 다음 월요일~일요일 7일치 일정 캡처
    - cron: "0 12 * * 0"
  # 수동 실행 지원
  workflow_dispatch:
    inputs:
      target_week_start:
        description: "주 시작일 (월요일 KST, YYYY-MM-DD). 비워두면 다음 월요일로 자동 계산."
        required: false
        type: string

permissions:
  contents: read

jobs:
  capture-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Weekly Capture Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://powerplay.kr' }}
          TARGET_WEEK_START: ${{ github.event.inputs.target_week_start }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/capture-instagram-weekly.ts

      - name: Preserve generated stories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-stories-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/instagram/
          if-no-files-found: ignore
          retention-days: 30

      - name: Ping Better Stack heartbeat
        if: ${{ success() }}
        env:
          BETTER_STACK_HEARTBEAT_URL: ${{ secrets.BETTER_STACK_HEARTBEAT_WEEKLY_MATCHES_URL }}
        run: |
          if [ -n "$BETTER_STACK_HEARTBEAT_URL" ]; then
            curl --fail --silent --show-error --max-time 10 --retry 2 "$BETTER_STACK_HEARTBEAT_URL"
          fi
